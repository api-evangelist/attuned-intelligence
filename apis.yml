aid: attuned-intelligence
name: Attuned Intelligence
description: >-
  Attuned Intelligence is a healthcare voice AI company that automates hospital and
  community health center call centers with supervised, EHR-integrated Voice AI Agents.
  Its agents answer every patient call instantly and in the caller's language, resolve
  needs end-to-end (appointment booking, medication refills, triage routing), and provide
  real-time human oversight with transcripts and reporting so automation stays safe and
  auditable. Founded in 2024 by leaders from DeepMind, Google Health, AssemblyAI, and
  DocuSign, the company emerged from stealth in October 2025 with $13M in funding backed
  by Threshold Ventures, and serves customers including Cambridge Health Alliance and Lowell
  Community Health Center. The platform is SOC 2 and HIPAA compliant. Attuned publishes no
  first-party developer/product API; its Wix-hosted marketing site exposes a generic hosted
  Site MCP endpoint for agentic access to public site content and business details.
