source: https://www.attuned-intelligence.com/llms.txt
notes: >-
  Attuned Intelligence publishes no first-party product/voice-AI API. The site
  is built on Wix, which exposes a generic hosted Site MCP endpoint (advertised
  in the site's llms.txt) for agentic access to public site content, business
  details, and Wix booking/commerce APIs. Captured verbatim from the provider's
  own llms.txt AI-Agent-Access section; the tools/list was confirmed live
  (HTTP 200 JSON-RPC). This is the Wix Site MCP, not a bespoke Attuned API MCP.
server:
  name: attuned-intelligence-site
  transport: http
  url: https://www.attuned-intelligence.com/_api/mcp
  auth: none
  docs: https://dev.wix.com/docs/develop-websites/articles/get-started/about-the-wix-site-mcp
tools:
  - name: GetBusinessDetails
    description: Retrieves business and site details such as timezone, email, phone, and address.
  - name: SearchInSite
    description: Searches the site for information (param searchTerm).
  - name: SearchSiteApiDocs
    description: Retrieves the API documentation for the Wix business solutions installed on this site (param searchTerm).
  - name: GenerateVisitorToken
    description: Creates a new visitor session and obtains a visitor access token for the site.
  - name: CallWixSiteAPI
    description: Calls API methods on the site to query data, book an appointment, or start a purchase (params visitorToken, url, method, body).
  - name: ReadFullDocsArticle
    description: Fetches a complete article from the Wix developer documentation portal (param articleUrl).
  - name: ReadFullDocsMethodSchema
    description: Fetches the full schema for a Wix API method (param articleUrl).
